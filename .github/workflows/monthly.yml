name: Monthly refresh

on:
  # Daily is cheap: fetch only touches threads still inside their 7-day window, so most
  # days nothing changes and nothing is committed. A month publishes on the first run
  # after its snapshot completes.
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen

      - run: uv run sejr fetch
      - run: uv run sejr normalize
      - run: uv run sejr features
      # Never --backfill here: classify refuses a run over 500 uncached calls, which
      # guards against reclassifying history by accident.
      - run: uv run sejr classify
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: uv run sejr aggregate
      - run: uv run sejr export
      - run: uv run pytest -q

      - name: Commit data changes
        id: commit
        run: |
          paths=()
          for p in data/raw data/answers site/data; do
            [ -e "$p" ] && paths+=("$p")
          done
          git add -A -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          month=$(git diff --cached --name-only -- data/raw \
            | sed -nE 's#^data/raw/[^/]+/([0-9]{4}-[0-9]{2})/.*#\1#p' | sort | tail -n 1)
          [ -n "$month" ] || month=$(jq -r '.latest_month // empty' site/data/metrics.json 2>/dev/null || true)
          [ -n "$month" ] || month=$(date -u +%Y-%m)
          if git diff --cached --quiet -- site; then site=false; else site=true; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh $month"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "site_changed=$site" >> "$GITHUB_OUTPUT"

      - name: Deploy the site
        if: steps.commit.outputs.site_changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Open an issue for the new column
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(jq -r '.latest_month // empty' site/data/metrics.json 2>/dev/null || true)
          if [ -z "$month" ]; then
            echo "metrics.json has no latest_month"
            exit 0
          fi
          if [ -f "site/articles/$month.md" ]; then
            echo "site/articles/$month.md already exists"
            exit 0
          fi
          title="Write the $(date -u -d "$month-01" '+%B %Y') column"
          # List instead of search: the search index lags, and a missed match would
          # open a duplicate on the next day's run.
          if gh issue list --state all --limit 1000 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "issue already exists: $title"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          $month is complete and exported, but \`site/articles/$month.md\` does not exist yet.

          Write the column from \`site/data/metrics.json\` and \`site/data/samples/$month.json\`, following \`docs/style-guide.md\` and the article contract in \`docs/architecture.md\`. Every number must match \`metrics.json\`; a second agent fact-checks it before merge.
          EOF
          )"
