[project]
name = "sejr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thomas Conner", email = "thomas.conner@connertechnology.io" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pytz>=2026.6",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
sejr = "sejr:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
